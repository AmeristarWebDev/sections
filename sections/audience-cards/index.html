<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ameristar section — audience-cards</title>
<!-- Fonts are loaded HERE for standalone preview / iframe mode only.
     The script-injected embed does NOT load fonts; the AEM page already has them. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Fixed-frame contract: this page fills whatever height the AEM embed gives it
     and never shows a scrollbar. Content is safe-centered (margin:auto collapses
     to 0 if content is taller, so overflow clips at the bottom, not both ends). */
  html,body{margin:0;background:#fff;height:100%}
  body{display:flex;flex-direction:column;overflow:hidden}
  #ams-root{width:100%;margin:auto 0;flex:0 0 auto}
</style>
</head>
<body class="ams-standalone">

<div id="ams-root" data-ameristar-section="audience-cards"></div>

<script>
  // iframe mode: ?content=<url-encoded JSON url> → live content from the DAM
  (function () {
    var p = new URLSearchParams(location.search);
    var c = p.get('content');
    if (c) document.getElementById('ams-root').setAttribute('data-content', c);
  })();
</script>
<script src="section.js"></script>
<script>
  (function () {
    var NAME = 'audience-cards';
    var root = document.getElementById('ams-root');

    // Editor mode: the editor posts {type:'ams:content', data} for live preview.
    window.addEventListener('message', function (e) {
      var m = e.data;
      if (!m || m.type !== 'ams:content') return;
      var api = window.AmeristarSections && window.AmeristarSections[NAME];
      if (api) { api.ensureCss(); root.classList.add('ams-section', 'ams-' + NAME); api.render(root, m.data); }
    });

    // Report content height to the parent. A raw-HTML embed uses it to size the
    // iframe; the editor uses it to warn when content would overflow the frame.
    function postHeight() {
      if (window.parent === window) return;
      window.parent.postMessage({ type: 'ams:height', name: NAME, height: root.scrollHeight, frame: window.innerHeight }, '*');
    }
    if ('ResizeObserver' in window) { new ResizeObserver(postHeight).observe(root); new ResizeObserver(postHeight).observe(document.body); }
    window.addEventListener('load', postHeight);
    // Let the editor know we're ready to receive content.
    if (window.parent !== window) window.parent.postMessage({ type: 'ams:ready', name: NAME }, '*');
  })();
</script>
</body>
</html>
